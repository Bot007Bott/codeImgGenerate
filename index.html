<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSnap — Code to Image</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ── Header ── -->
    <header class="header">
      <div class="header-brand">
        <svg
          class="header-icon"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span class="header-title">CodeSnap</span>
      </div>
      <div class="header-actions">
        <button id="copyBtn" class="btn" title="Copy source code as text">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span id="copyLabel">Copy Code</span>
        </button>
        <button
          id="copyImageBtn"
          class="btn"
          title="Copy image to clipboard (paste into Telegram, etc.)"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="M21 15l-5-5L5 21" />
          </svg>
          <span id="copyImageLabel">Copy Image</span>
        </button>
        <button id="clearBtn" class="btn" title="Clear editor">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          <span>Clear</span>
        </button>
        <button
          id="downloadBtn"
          class="btn btn-primary"
          title="Download as PNG"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <span id="downloadLabel">Download PNG</span>
        </button>
      </div>
    </header>

    <!-- ── Main Layout ── -->
    <main class="app">
      <!-- ── Left: Editor + Controls ── -->
      <section class="editor-section">
        <!-- Controls bar -->
        <div class="controls">
          <div class="control">
            <label for="langSelect">Language</label>
            <select id="langSelect">
              <option>JavaScript</option>
              <option>HTML</option>
              <option>CSS</option>
              <option>Python</option>
              <option>Java</option>
              <option>C++</option>
              <option>PHP</option>
              <option>Dart</option>
            </select>
          </div>

          <div class="control">
            <label>Font <span id="fontVal">15</span>px</label>
            <input
              id="fontSize"
              type="range"
              min="11"
              max="28"
              value="15"
              step="1"
            />
          </div>

          <div class="control">
            <label>Line Height <span id="lhVal">1.7</span></label>
            <input
              id="lineHeight"
              type="range"
              min="1.0"
              max="2.5"
              value="1.7"
              step="0.1"
            />
          </div>

          <div class="control">
            <label>Padding <span id="padVal">32</span>px</label>
            <input
              id="padding"
              type="range"
              min="8"
              max="80"
              value="32"
              step="2"
            />
          </div>

          <div class="control">
            <label>Radius <span id="radVal">16</span>px</label>
            <input
              id="borderRadius"
              type="range"
              min="0"
              max="32"
              value="16"
              step="1"
            />
          </div>

          <div class="control toggle-ctrl">
            <span class="toggle-text">Line Numbers</span>
            <label class="switch">
              <input type="checkbox" id="showLines" checked />
              <span class="track"></span>
            </label>
          </div>

          <div class="control toggle-ctrl">
            <span class="toggle-text">Window Header</span>
            <label class="switch">
              <input type="checkbox" id="showHeader" checked />
              <span class="track"></span>
            </label>
          </div>
        </div>

        <!-- Code textarea -->
        <div class="editor-wrap">
          <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Paste your code here..."
          >
// Welcome to CodeSnap ✨
// Paste your code and download a beautiful image.

function fibonacci(n) {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}

const result = fibonacci(10);
console.log(`Fibonacci(10) = ${result}`);</textarea
          >
          <div class="editor-linecount" id="editorLineCount">12 lines</div>
        </div>
      </section>

      <!-- ── Right: Live Preview ── -->
      <section class="preview-section">
        <div class="preview-label">Preview</div>
        <div class="preview-scroll" id="previewScroll">
          <div id="codeCard" class="code-card">
            <!-- Window header with dots + language label -->
            <div id="windowHeader" class="card-header">
              <div class="card-dots">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
              </div>
              <span id="windowTitle" class="card-lang">JavaScript</span>
            </div>
            <!-- Code content rendered here -->
            <pre
              id="codeBlock"
              class="card-code"
            ><code id="codeContent"></code></pre>
          </div>
        </div>
      </section>
    </main>

    <!-- html2canvas CDN — required for PNG export -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
